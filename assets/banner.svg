<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="0.5" stop-color="#16231c"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c4bd"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8c4bd"/>
    </linearGradient>
    <pattern id="rivets" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#2a3d33"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="280">
        <animate attributeName="width" from="0" to="1000" dur="2.4s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1000" height="280" fill="url(#steel)"/>
  <rect width="1000" height="280" fill="url(#rivets)"/>

  <ellipse cx="500" cy="140" rx="420" ry="130" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(110 140)" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#39ff88" stroke-width="2"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#39ff88" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <circle r="30" fill="none" stroke="#7dffb4" stroke-width="1.5" stroke-dasharray="2 8"/>
    </g>
    <text y="12" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#39ff88">R</text>
  </g>
  <g transform="translate(890 140)" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#39ff88" stroke-width="2"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#39ff88" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
    </g>
    <text y="12" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#39ff88">K</text>
  </g>

  <g clip-path="url(#reveal)">
    <text x="500" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="14" fill="#39ff88" filter="url(#blur)" opacity="0.6">ROHITH KUMAR</text>
    <text x="500" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="14" fill="url(#title)">ROHITH KUMAR</text>
  </g>

  <line x1="250" y1="150" x2="750" y2="150" stroke="#39ff88" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="1.6s" begin="1.2s" fill="freeze"/>
  </line>

  <g font-family="'Courier New', monospace" font-size="20" fill="#7dffb4" text-anchor="middle" letter-spacing="3">
    <text x="500" y="195" opacity="0">FULL STACK DEVELOPER
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.06;0.30;0.36;0.4;0.6;0.8;0.95;1" dur="12s" begin="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="195" opacity="0">.NET &#8226; REACT &#8226; PYTHON
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.3;0.34;0.4;0.63;0.7;0.8;0.95;1" dur="12s" begin="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="195" opacity="0">THE STACK BOWS TO MY WILL
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;0.3;0.5;0.6;0.65;0.72;0.95;1;1" dur="12s" begin="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="500" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#5f7a6b" letter-spacing="4">VIJAYAWADA &#8226; HYDERABAD &#8226; OPEN TO SOFTWARE OPPORTUNITIES</text>

  <rect x="0" y="-6" width="1000" height="6" fill="#39ff88" opacity="0.07">
    <animate attributeName="y" from="-6" to="280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="3" y="3" width="994" height="274" fill="none" stroke="#39ff88" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
